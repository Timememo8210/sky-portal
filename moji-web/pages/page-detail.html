          <p>人类的大脑在过去20万年间几乎没有本质的变化。我们处理信息的认知能力——工作记忆、注意力持续时间、决策质量——依然停留在狩猎采集时代的水平。然而，我们面对的信息量却呈指数级增长。</p>

          <p>Herbert Simon 在1971年就预见到了这个问题："信息消费的是注意力。因此，信息的丰富导致了注意力的贫乏。" 半个世纪后的今天，这句话的精准度令人震惊。</p>

            <li><strong>低阻力设计</strong>：下一个视频自动播放，你不需要做任何决策</li>

          <h3>2. 环境设计</h3>

          <p>与其依赖意志力，不如改变环境。关闭非必要通知、使用专注模式、设定固定的时间检查社交媒体。将注意力保护措施编码到你的生活系统中。</p>

          <h3>3. 深度工作习惯</h3>

          <h2>什么是奖励超级反应倾向</h2>

          <p>芒格引用了心理学史上最著名的实验之一——B.F. 斯金纳的老鼠和鸽子实验。斯金纳发现，通过精心设计奖励机制，他可以让动物表现出几乎任何他想要的行为。更重要的是，当奖励变得不确定时（间歇性强化），行为反而变得更加顽固和持久。</p>

          <p>过去十年，Intel在制程竞赛中节节败退。从14nm到10nm的延期让AMD凭借台积电的先进制程夺走了大量市场份额。Apple自研芯片的崛起更是将Intel挤出Mac产品线。18A是Intel证明"我们还能做世界最好的芯片"的最好机会。</p>

          <h3>地缘政治的变量</h3>

          <p>在当前的国际环境下，美国对半导体制造的重视达到了前所未有的高度。《CHIPS法案》为Intel提供了巨额补贴，条件是在美国本土建厂。18A量产不仅是技术里程碑，更是政治资本。</p>

          <h3>代工市场的野心</h3>

          <p>Intel Foundry Services（IFS）的目标是成为台积电和三星之外的第二选择。18A是Intel向潜在代工客户展示实力的关键——如果你的最先进制程不能和台积电的2nm/1.4nm竞争，没有人会把订单给你。</p>

          <h2>技术挑战</h2>

          <p>RibbonFET和PowerVia的引入带来了巨大的工程挑战：</p>

          <ol>
            <li><strong>良率</strong>：全新的晶体管架构意味着良率爬坡周期更长。Intel历史上在新制程良率方面表现不佳</li>
            <li><strong>背面供电的复杂度</strong>：PowerVia需要在晶圆背面制作数百万个微小的TSV（硅通孔），对工艺精度要求极高</li>
            <li><strong>High-NA EUV的成熟度</strong>：ASML的High-NA EUV光刻机本身就是一项前沿技术，Intel是首个大规模采用者</li>
            <li><strong>设计生态</strong>：代工不仅仅是制造——还需要EDA工具、IP库、设计流程的完整生态支持</li>
          </ol>

          <h2>竞争格局</h2>

          <p>到2025年底，全球先进制程的竞争格局大致如下：</p>

          <ul>
            <li><strong>TSMC 2nm (N2)</strong>：2025年下半年量产，采用GAA Nanosheet，良率领先</li>
            <li><strong>Samsung 2nm (SF2)</strong>：2025年量产，但良率和产能一直是Samsung的弱项</li>
            <li><strong>Intel 18A</strong>：2025年下半年量产，技术上最具野心，但执行风险最高</li>
          </ul>

          <blockquote>
            <p>Intel不需要做到和TSMC完全一样好——它只需要做到"足够好"，同时利用地理多样性和美国政府的支持来吸引客户。</p>
          </blockquote>

          <h2>展望</h2>

          <p>18A的成功与否，将在未来3-5年内决定Intel的命运。如果成功，Intel将重新成为半导体制造的领导者；如果失败，Intel可能不得不考虑拆分制造和设计业务——这曾经是不可想象的。</p>

          <p>对整个行业来说，Intel的18A也是一件好事。<strong>竞争驱动创新</strong>，一个强势的Intel意味着台积电不能安于现状，意味着全球芯片供应链更加多元化，也意味着前沿技术的推进速度更快。</p>

          <p>半导体制造的极限在哪里？没有人知道答案。但18A告诉我们，人类还在向前推。</p>

    // ============================================
    // 页面初始化
    // ============================================

    /**
     * 获取URL参数中的页面ID，默认为1
     */
    function getPageId() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'), 10);
      return (id >= 1 && id <= 3) ? id : 1;
    }

    /**
     * 渲染页面内容
     */
    function renderPage(pageId) {
      const page = PAGES[pageId];
      if (!page) return;

      // 设置页面标题
      document.title = page.title + ' — 墨记';

      // 标题
      document.getElementById('pageTitle').textContent = page.title;

      // 日期 & 阅读时间
      document.getElementById('pageDate').textContent = page.date;
      document.getElementById('pageReadTime').textContent = page.readTime;

      // 标签
      const tagsContainer = document.getElementById('pageTags');
      tagsContainer.innerHTML = page.tags
        .map(tag => `<span class="tag">${tag}</span>`)
        .join('');

      // 正文
      document.getElementById('pageBody').innerHTML = page.body;

      // 作者信息
      document.getElementById('authorAvatar').src = page.author.avatar;
      document.getElementById('authorName').textContent = page.author.name;
      document.getElementById('authorBio').textContent = page.author.bio;
    }

    /**
     * 阅读进度条
     */
    function updateReadingProgress() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      document.getElementById('readingProgress').style.width = progress + '%';
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      const pageId = getPageId();
      renderPage(pageId);

      // 记录访问统计
      Analytics.updateStatsDisplay('page_' + pageId);

      // 阅读进度条
      window.addEventListener('scroll', updateReadingProgress, { passive: true });
      updateReadingProgress();
    });
  </script>
